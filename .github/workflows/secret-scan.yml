name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          printf 'GITLEAKS_BIN=%s/gitleaks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prove the detector rejects a fake secret
        run: scripts/test-secret-scan.sh

      - name: Scan the checked-out tree and introduced commits
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-secrets.sh
